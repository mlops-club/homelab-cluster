# Harbor publishes amd64-only images (goharbor/*). Pin every component to amd64 nodes so none can be
# scheduled onto the arm64 node cluster-node-5, where the image pull would fail.
portal:
  nodeSelector: &amd64
    kubernetes.io/arch: amd64
core:
  nodeSelector: *amd64
jobservice:
  nodeSelector: *amd64
registry:
  nodeSelector: *amd64
nginx:
  nodeSelector: *amd64
exporter:
  nodeSelector: *amd64
database:
  internal:
    nodeSelector: *amd64
redis:
  internal:
    nodeSelector: *amd64

containerSecurityContext:
  runAsNonRoot: false
  allowPrivilegeEscalation: true

expose:
  type: ingress
  tls:
    enabled: true
    # none: the chart names no secret; traefik-private serves its default certificate (priv-wildcard-tls)
    certSource: none
  ingress:
    controller: default
    className: traefik-private
    hosts:
      core: cr.priv.mlops-club.org
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"

externalURL: https://cr.priv.mlops-club.org

persistence:
  enabled: true
  resourcePolicy: "keep"
  persistentVolumeClaim:
    jobservice:
      jobLog:
        storageClass: nas-nfs
        accessMode: ReadWriteOnce
        size: 5Gi
    database:
      storageClass: nas-nfs
      accessMode: ReadWriteOnce
      size: 10Gi
    redis:
      storageClass: nas-nfs
      accessMode: ReadWriteOnce
      size: 5Gi
    registry:
      storageClass: nas-nfs
      accessMode: ReadWriteOnce
      size: 200Gi
    trivy:
      storageClass: nas-nfs
      accessMode: ReadWriteOnce
      size: 5Gi
  imageChartStorage:
    type: filesystem
    filesystem:
      rootdirectory: /storage

notary:
  enabled: false

chartmuseum:
  enabled: false

trivy:
  enabled: false
  nodeSelector: *amd64
