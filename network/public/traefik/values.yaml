ingressClass:
  enabled: true
  name: traefik-public
  isDefaultClass: false

service:
  type: ClusterIP
  ports:
    web:
      port: 80
      targetPort: 80
    websecure:
      port: 443
      targetPort: 443

ports:
  web:
    port: 80
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
  websecure:
    port: 443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    tls:
      enabled: true

# Configure entrypoints
# Cloudflare Tunnel connects via HTTPS, Traefik terminates TLS
# Note: exposedPort 80 maps to entrypoint address :80 (Helm chart convention)
entryPoints:
  web:
    address: ":80/tcp"
    # No redirect - Cloudflare handles SSL termination
  websecure:
    address: ":443/tcp"
    http:
      tls:
        enabled: true

# Default certificate for every router that names no TLS secret. Chart 38 renders this as the
# `default` TLSStore CRD (the old `tls.stores` key is ignored by the chart)
tlsStore:
  default:
    defaultCertificate:
      secretName: mlops-wildcard-tls

# Labels every chart-rendered object, including the default TLSStore, so kubernetesCRD.labelSelector
# below picks it up. Not part of the pod selector, so upgrades keep working
commonLabels:
  traefik.mlops-club.org/instance: public

# Configure Kubernetes provider to watch all namespaces
providers:
  # Traefik's own object types (TLSStore, IngressRoute, Middleware) are read only when labeled
  # traefik.mlops-club.org/instance=public, from any namespace. Without it each instance also reads the
  # other's `default` TLSStore, and two default stores make Traefik drop the default certificate.
  # Plain Ingress objects are selected by ingressClass below, not by this label
  kubernetesCRD:
    labelSelector: traefik.mlops-club.org/instance=public
  kubernetesIngress:
    namespaces: []  # Empty array means watch all namespaces
    # Both IngressClasses (traefik-public, traefik-private) share the controller
    # traefik.io/ingress-controller. Without this, each Traefik claims every
    # Ingress of both classes and they overwrite each other's status.loadBalancer.
    ingressClass: traefik-public

# Enable access logs for debugging
accessLog:
  enabled: true
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: keep
      names:
        User-Agent: keep
        Host: keep
        X-Forwarded-For: keep
        X-Forwarded-Host: keep
