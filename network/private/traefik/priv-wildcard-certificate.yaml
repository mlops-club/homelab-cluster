---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik-private
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: priv-wildcard
  namespace: traefik-private
spec:
  secretName: priv-wildcard-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  dnsNames:
    - "*.priv.mlops-club.org"
    - priv.mlops-club.org

# 1. deploy traefik
# 2. give it a tailnet IP
# 3. create an A record for that tailnet IP
# 4. register a cert for that A record
# 5. traefik-private serves that cert as its default (TLSStore in traefik/values.yaml); apps name no secret
