# Purpose: Grafana Synthetic Monitoring private probe "homelab-cluster" running inside the cluster
# Scope: Namespace sm-probe; one agent pod. The API token Secret is created by deploy.sh from Terraform output
# Overview: The agent opens one outbound gRPC connection to Grafana Cloud, receives the checks assigned to the
#   homelab-cluster probe (monitoring/terraform/checks_*.tf), runs them and pushes metrics and logs back. No
#   inbound ports. Nodes are on the tailnet, so pods reach *.priv.mlops-club.org (100.x addresses) the same way
#   a phone does. Exactly one replica: two agents with one token would fight over the probe. Kept off
#   cluster-node-4, which is usually powered off
---
apiVersion: v1
kind: Namespace
metadata:
  name: sm-probe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sm-probe
  namespace: sm-probe
  labels:
    app.kubernetes.io/name: sm-probe
spec:
  replicas: 1
  strategy:
    type: Recreate # never two agents on one probe token
  selector:
    matchLabels:
      app.kubernetes.io/name: sm-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sm-probe
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [cluster-node-4]
      containers:
        - name: agent
          # Non-browser image: private checks are k6 scripted and HTTP only; the browser check runs on public probes
          image: grafana/synthetic-monitoring-agent:v0.71.0
          args:
            - --api-server-address=synthetic-monitoring-grpc-us-west-0.grafana.net:443
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sm-probe-token
                  key: api-token
          ports:
            - name: http
              containerPort: 4050
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
